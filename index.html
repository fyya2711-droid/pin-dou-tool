function readImage(f){return new Promise((res,rej)=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{URL.revokeObjectURL(u);res(im)};im.onerror=rej;im.src=u})}

function render(gw,gh){
  const cell=Math.max(20,Math.min(80,+$('cell').value||40));
  const userFs=Math.max(10,Math.min(32,+$('font').value||15));
  const wrap=$('chartWrap');wrap.innerHTML='';
  wrap.style.display='block';
  wrap.style.width='max-content';
  const margin=cell*1.6;
  const W=gw*cell+margin*2,H=gh*cell+margin*2;
  const ns='http://www.w3.org/2000/svg';

  svg.setAttribute('xmlns',ns);svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.setAttribute('width',W);svg.setAttribute('height',H);
  svg.style.display='block';svg.style.background='#fff';
  const bg=document.createElementNS(ns,'rect');
  bg.setAttribute('x',0);bg.setAttribute('y',0);bg.setAttribute('width',W);bg.setAttribute('height',H);bg.setAttribute('fill','#fff');svg.appendChild(bg);

  const codeFs=Math.max(9,Math.min(userFs,cell*.42));

    t.setAttribute('font-size',size);t.setAttribute('font-family','Arial,sans-serif');

  for(let x=0;x<gw;x++){
    const cx=margin+x*cell+cell/2;
    addText(String(x+1),cx,margin/2,coordFs);
    addText(String(x+1),cx,H-margin/2,coordFs);
  }
  for(let y=0;y<gh;y++){
    const cy=margin+y*cell+cell/2;
    addText(String(y+1),margin/2,cy,coordFs);
    addText(String(y+1),W-margin/2,cy,coordFs);
  }
  for(let y=0;y<gh;y++)for(let x=0;x<gw;x++){
    const p=PALETTE[matrix[y][x]],a=p.rgb,xx=margin+x*cell,yy=margin+y*cell;

}
function renderUsage(){const a=[];for(let i=0;i<291;i++)if(counts[i])a.push({p:PALETTE[i],n:counts[i]});a.sort((a,b)=>b.n-a.n);$('usage').innerHTML='<table><tr><th>色号</th><th>颜色</th><th>数量</th></tr>'+a.map(u=>`<tr><td>${u.p.code}</td><td><span class="sw" style="background:rgb(${u.p.rgb.join(',')})"></span></td><td>${u.n}</td></tr>`).join('')+'</table>'}
function save(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
$('save').onclick=()=>{
  if(!matrix.length)return;
  const gh=matrix.length,gw=matrix[0].length;
  const requested=Math.max(20,Math.min(80,+$('cell').value||40));
  // iPhone/Safari 对单张 Canvas 的尺寸有硬限制。
  // 原代码固定按 6000px 上限计算，120×120 / 80×80 会得到接近
  // 6000×6000 的 Canvas，Safari 在 toBlob() 时会失败。
  // 这里只限制“PNG 导出画布”，不改变图纸实际格数、色卡匹配、
  // 预览或用户设置的格子像素。
  const maxSide=4000;
  const cell=Math.max(12,Math.min(requested,Math.floor((maxSide-220)/Math.max(gw,gh))));
  const margin=Math.max(70,Math.ceil(cell*1.6));
  const W=margin*2+gw*cell,H=margin*2+gh*cell;
  const c=document.createElement('canvas');c.width=W;c.height=H;
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);
  x.textAlign='center';x.textBaseline='middle';
  const fs=Math.max(8,Math.min(28,Math.min(+$('font').value||15,cell*.42)));
  const coordFs=Math.max(9,Math.min(14,cell*.32));
  // Top and bottom column coordinates.
  x.font=`600 ${coordFs}px Arial`;x.fillStyle='#111';
  for(let z=0;z<gw;z++){
    const cx=margin+z*cell+cell/2;
    x.fillText(z+1,cx,margin/2);
    x.fillText(z+1,cx,H-margin/2);
  }
  // Left and right row coordinates.
  for(let y=0;y<gh;y++){
    const cy=margin+y*cell+cell/2;
    x.fillText(y+1,margin/2,cy);
    x.fillText(y+1,W-margin/2,cy);
  }
  x.font=`700 ${fs}px Arial`;
  for(let y=0;y<gh;y++)for(let z=0;z<gw;z++){
    const p=PALETTE[matrix[y][z]],a=p.rgb,xx=margin+z*cell,yy=margin+y*cell;
    x.fillStyle=`rgb(${a[0]},${a[1]},${a[2]})`;x.fillRect(xx,yy,cell,cell);
    x.strokeStyle='rgba(70,70,70,.55)';x.lineWidth=1;x.strokeRect(xx+.5,yy+.5,cell-1,cell-1);
    x.lineWidth=Math.max(.5,fs*.08);
    x.strokeStyle=lum(a)>150?'#fff':'#111';
    x.fillStyle=lum(a)>150?'#111':'#fff';
    x.strokeText(p.code,xx+cell/2,yy+cell/2);x.fillText(p.code,xx+cell/2,yy+cell/2);
  }
  x.strokeStyle='#222';x.lineWidth=3;x.strokeRect(margin,margin,gw*cell,gh*cell);
  try{
    c.toBlob(b=>{
      if(b){
        save(b,'拼豆施工图_完整四边坐标.png');
        setStatus('PNG导出完成。','ok');
      }else{
        setStatus('PNG导出失败：当前设备浏览器无法处理这张图片。','err');
      }
    },'image/png');
  }catch(e){
    console.error(e);
    setStatus('PNG导出失败：当前设备浏览器无法处理这张图片。','err');
  }
};
$('csv').onclick=()=>save(new Blob(['\ufeff'+matrix.map(r=>r.map(i=>PALETTE[i].code).join(',')).join('\n')],{type:'text/csv'}),'拼豆逐格色号.csv');$('qty').onclick=()=>{const rows=[['色号','R','G','B','数量']];for(let i=0;i<291;i++)if(counts[i])rows.push([PALETTE[i].code,...PALETTE[i].rgb,counts[i]]);save(new Blob(['\ufeff'+rows.map(r=>r.join(',')).join('\n')],{type:'text/csv'}),'拼豆颜色用量.csv')};
</script></body></html>
